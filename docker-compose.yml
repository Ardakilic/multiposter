services:
  app:
    build: .
    # image: ghcr.io/ardakilic/multiposter:latest  # use the published image instead of building (remove `build`)
    env_file:
      - path: .env
        required: false
    environment:
      # in-network addresses; everything else comes from .env
      DATABASE_URL: postgres://postgres:postgres@db:5432/multiposter
      S3_ENDPOINT: http://s3mock:9090
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025} # Mailpit unless .env sets a real SMTP server
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiposter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: multiposter
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/ || exit 1"]
      interval: 5s
      retries: 10

  # catches all outgoing mail; web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 15

  # `make` runs npm through this (dev profile); never starts with a plain `docker compose up`
  dev:
    image: node:24-slim
    profiles: [dev]
    working_dir: /app
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules # Linux binaries, kept apart from the host's
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/multiposter
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/multiposter_test
      S3_ENDPOINT: http://s3mock:9090
      TEST_S3_ENDPOINT: http://s3mock:9090
      SMTP_URL: smtp://mailpit:1025
      TEST_SMTP_URL: smtp://mailpit:1025
      TEST_MAILPIT_URL: http://mailpit:8025
      S3_BUCKET: multiposter
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      APP_SECRET: dev-only-secret-never-use-in-production # dev only
      HOSTNAME: 0.0.0.0
      WORKER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata:
  dev_node_modules:
